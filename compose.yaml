services:
  whitebox-scanner:
    build:
      context: .
      network: host
      args:
        SEMGREP_VERSION: ${SEMGREP_VERSION:-1.179.0}
        GITLEAKS_VERSION: ${GITLEAKS_VERSION:-8.30.1}
        TRIVY_VERSION: ${TRIVY_VERSION:-0.74.0}
        OSV_SCANNER_VERSION: ${OSV_SCANNER_VERSION:-2.6.0}
        JOERN_VERSION: ${JOERN_VERSION:-4.0.631}
        INSTALL_JOERN: ${INSTALL_JOERN:-0}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      API_KEY: ${API_KEY:-}
      DATA_DIR: /data
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      MAX_EXPANDED_BYTES: ${MAX_EXPANDED_BYTES:-1073741824}
      MAX_ARCHIVE_ENTRIES: ${MAX_ARCHIVE_ENTRIES:-20000}
      MAX_FINDINGS: ${MAX_FINDINGS:-10000}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-900}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      PRUNE_INTERVAL_SECONDS: ${PRUNE_INTERVAL_SECONDS:-3600}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-1}
      SCANNER_PARALLELISM: ${SCANNER_PARALLELISM:-1}
      MAX_SCANNER_PROCESSES: ${MAX_SCANNER_PROCESSES:-}
      SCANNER_PROCESS_LIMITS: ${SCANNER_PROCESS_LIMITS:-}
      VERIFY_WITH_CLAUDE: ${VERIFY_WITH_CLAUDE:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VERIFY_MODEL: ${VERIFY_MODEL:-claude-opus-5-5}
      VERIFY_MAX_FINDINGS: ${VERIFY_MAX_FINDINGS:-20}
      VERIFY_CONCURRENCY: ${VERIFY_CONCURRENCY:-3}
    dns:
      - ${DNS_SERVER:-1.1.1.1}
      - ${DNS_FALLBACK_SERVER:-8.8.8.8}
    volumes:
      - scanner-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${MEMORY_LIMIT:-6g}
    cpus: ${CPU_LIMIT:-2.0}

volumes:
  scanner-data:
