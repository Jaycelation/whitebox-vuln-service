[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebox-vuln-mcp"
version = "0.2.0"
description = "MCP adapter for the Whitebox Vulnerability Check Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.0,<2",
]

[project.scripts]
whitebox-mcp = "whitebox_mcp:main"

[tool.setuptools]
py-modules = ["whitebox_mcp"]
